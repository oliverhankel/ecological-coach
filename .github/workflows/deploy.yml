name: Test and deploy

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ionos-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSER_NO_INTERACTION: 1
  COMPOSER_PROCESS_TIMEOUT: 0

jobs:
  test-and-deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, pdo_mysql

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        env:
          APP_ENV: testing
          APP_DEBUG: "true"
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          SESSION_DRIVER: array
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
        run: php artisan test

      - name: Show Laravel log after test failure
        if: failure()
        run: |
          if [ -f storage/logs/laravel.log ]; then
            tail -n 200 storage/logs/laravel.log
          fi

      - name: Prepare production dependencies
        if: github.event_name == 'push'
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --classmap-authoritative

      - name: Configure SSH
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.IONOS_SSH_KEY }}
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
        run: |
          test -n "$SSH_PRIVATE_KEY"
          test -n "$IONOS_HOST"
          test -n "$IONOS_USER"
          test -s .github/ionos_known_hosts

          install -d -m 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            | tr -d '\r' \
            > ~/.ssh/id_ed25519

          install -m 644 \
            .github/ionos_known_hosts \
            ~/.ssh/known_hosts

          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y \
            -f ~/.ssh/id_ed25519 \
            >/dev/null

          ssh-keygen \
            -F "$IONOS_HOST" \
            -f ~/.ssh/known_hosts \
            >/dev/null

          ssh \
             -o BatchMode=yes \
             -o IdentitiesOnly=yes \
             -o ConnectTimeout=15 \
             -i ~/.ssh/id_ed25519 \
             "$IONOS_USER@$IONOS_HOST" \
             'echo "SSH connection successful"'

      - name: Prepare server
        if: github.event_name == 'push'
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          DEPLOY_PATH: ${{ secrets.IONOS_DEPLOY_PATH }}
          PHP_BIN: ${{ vars.IONOS_PHP_BIN }}
        run: |
          test -n "$DEPLOY_PATH"
          test -n "$PHP_BIN"

          ssh \
            "$IONOS_USER@$IONOS_HOST" \
            bash -s -- "$DEPLOY_PATH" "$PHP_BIN" <<'REMOTE'
          set -e

          deploy_path="$1"
          php_bin="$2"

          mkdir -p \
            "$deploy_path/storage/framework/cache/data" \
            "$deploy_path/storage/framework/sessions" \
            "$deploy_path/storage/framework/views" \
            "$deploy_path/storage/logs" \
            "$deploy_path/bootstrap/cache"

          chmod -R u+rwX \
            "$deploy_path/storage" \
            "$deploy_path/bootstrap/cache"

          if [ ! -f "$deploy_path/.env" ]; then
            echo "Production .env is missing: $deploy_path/.env"
            exit 1
          fi

          if [ -f "$deploy_path/artisan" ]; then
            cd "$deploy_path"
            "$php_bin" artisan down --retry=60
          fi
          REMOTE

      - name: Upload application
        if: github.event_name == 'push'
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          DEPLOY_PATH: ${{ secrets.IONOS_DEPLOY_PATH }}
        run: |
          rsync \
            --archive \
            --compress \
            --delete-delay \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='storage/' \
            --exclude='public/storage' \
            --exclude='database/database.sqlite' \
            ./ "$IONOS_USER@$IONOS_HOST:$DEPLOY_PATH/"

      - name: Finalize deployment
        if: github.event_name == 'push'
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          DEPLOY_PATH: ${{ secrets.IONOS_DEPLOY_PATH }}
          PHP_BIN: ${{ vars.IONOS_PHP_BIN }}
        run: |
          ssh \
            "$IONOS_USER@$IONOS_HOST" \
            bash -s -- "$DEPLOY_PATH" "$PHP_BIN" <<'REMOTE'
          set -e

          deploy_path="$1"
          php_bin="$2"

          cd "$deploy_path"

          test -f artisan
          test -f .env

          "$php_bin" artisan config:clear
          "$php_bin" artisan migrate --force
          "$php_bin" artisan storage:link
          "$php_bin" artisan optimize
          "$php_bin" artisan up
          "$php_bin" artisan about --only=environment
          REMOTE

      - name: Run production healthcheck
        if: github.event_name == 'push'
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          test -n "$PRODUCTION_URL"

          curl \
            --fail \
            --show-error \
            --silent \
            --retry 3 \
            --retry-delay 5 \
            "${PRODUCTION_URL%/}/up"

      - name: Restore application after deployment failure
        if: ${{ failure() && github.event_name == 'push' }}
        continue-on-error: true
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          DEPLOY_PATH: ${{ secrets.IONOS_DEPLOY_PATH }}
          PHP_BIN: ${{ vars.IONOS_PHP_BIN }}
        run: |
          ssh \
            "$IONOS_USER@$IONOS_HOST" \
            bash -s -- "$DEPLOY_PATH" "$PHP_BIN" <<'REMOTE'
          deploy_path="$1"
          php_bin="$2"

          if [ -f "$deploy_path/artisan" ]; then
            cd "$deploy_path"
            "$php_bin" artisan up || true
          fi
          REMOTE